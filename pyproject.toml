[project]
name = "audio-clean"
version = "0.1.0"
description = "Local audio cleanup: noise removal and speech restoration on your Mac"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepfilternet>=0.5.6",
    "fastapi>=0.162.0",
    "huggingface-hub>=2.4.0",
    "numpy<2",
    "python-multipart>=0.0.33",
    "resemble-enhance>=0.0.1",
    "soundfile>=0.14.0",
    "torch==2.1.2",
    "torchaudio==2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# resemble-enhance pins its training stack. Keep our torch pin, and drop
# deepspeed (training only, no macOS build) and gradio (its own demo UI).
override-dependencies = [
    "torch==2.1.2",
    "torchaudio==2.1.2",
    "torchvision==0.16.2",
    "numpy<2",
    "deepspeed; sys_platform == 'never'",
    "gradio; sys_platform == 'never'",
    "pandas>=2.1,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "rich>=13",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "tabulate>=0.9",
]
